<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="DUT Wolves Stats — live basketball statistics, fixtures and match management for Durban University of Technology basketball."
    />
    <link rel="canonical" href="https://dut-wolves-stats-app.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DUT Wolves Stats" />
    <meta property="og:title" content="DUT Wolves Stats | DUT Wolves Basketball" />
    <meta
      property="og:description"
      content="Follow DUT Wolves live basketball scores, fixtures, results and team statistics."
    />
    <meta property="og:url" content="https://dut-wolves-stats-app.vercel.app/" />
    <meta property="og:image" content="https://dut-wolves-stats-app.vercel.app/social-card.jpg" />
    <meta property="og:image:secure_url" content="https://dut-wolves-stats-app.vercel.app/social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DUT Wolves Stats branded share image with the white Wolves mark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DUT Wolves Stats | DUT Wolves Basketball" />
    <meta
      name="twitter:description"
      content="Follow DUT Wolves live basketball scores, fixtures, results and team statistics."
    />
    <meta name="twitter:image" content="https://dut-wolves-stats-app.vercel.app/social-card.jpg" />
    <meta
      name="twitter:image:alt"
      content="DUT Wolves Stats branded share image with the white Wolves mark"
    />
    <title>DUT Wolves Stats</title>
    <script>
      (function () {
        var storedTheme = localStorage.getItem('dws.theme');
        var theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      #app-boot {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(49, 197, 216, 0.12), transparent 38%),
          linear-gradient(145deg, #10151b 0%, #0b0d10 55%, #080a0c 100%);
        color: #f5f6f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        opacity: 1;
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      #app-boot.is-hidden {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      #app-boot::before {
        position: absolute;
        width: min(92vw, 36rem);
        aspect-ratio: 1;
        background: url('/wolves-mark-white.png') center / contain no-repeat;
        content: '';
        opacity: 0.045;
        transform: rotate(-12deg);
      }

      .boot-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        text-align: center;
      }

      .boot-mark {
        display: grid;
        width: 6rem;
        height: 6rem;
        place-items: center;
        border: 1px solid rgba(49, 197, 216, 0.35);
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 0 3rem rgba(49, 197, 216, 0.12), inset 0 1px rgba(255, 255, 255, 0.08);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }

      .boot-mark img {
        width: 4.1rem;
        height: 4.1rem;
        object-fit: contain;
      }

      .boot-brand {
        margin: 1.4rem 0 0;
        color: #f5f6f7;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.28em;
      }

      .boot-title {
        margin: 0.45rem 0 0;
        color: #31c5d8;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.38em;
        text-transform: uppercase;
      }

      .boot-track {
        width: 8.5rem;
        height: 2px;
        margin-top: 2rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
      }

      .boot-track span {
        display: block;
        width: 40%;
        height: 100%;
        background: #31c5d8;
        box-shadow: 0 0 0.8rem rgba(49, 197, 216, 0.8);
        animation: boot-progress 1.5s ease-in-out infinite;
      }

      .boot-caption {
        margin: 0.85rem 0 0;
        color: #a9afb7;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
      }

      .boot-retry {
        margin-top: 1.25rem;
        border: 1px solid rgba(49, 197, 216, 0.35);
        border-radius: 0.75rem;
        background: rgba(49, 197, 216, 0.1);
        color: #f5f6f7;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.65rem 1rem;
      }

      .boot-retry[hidden] {
        display: none;
      }

      @keyframes boot-breathe {
        50% { transform: translateY(-4px); }
      }

      @keyframes boot-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot,
        .boot-mark,
        .boot-track span {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" role="status" aria-live="polite" aria-label="Loading DUT Wolves Stats">
      <div class="boot-content">
        <div class="boot-mark" aria-hidden="true">
          <img src="/wolves-mark-white.png" alt="" />
        </div>
        <p class="boot-brand">DUT WOLVES</p>
        <p class="boot-title">Stats</p>
        <div class="boot-track" role="progressbar" aria-label="Loading application">
          <span></span>
        </div>
        <p class="boot-caption">BASKETBALL · ONE PACK</p>
        <button id="boot-retry" class="boot-retry" type="button" hidden>Still loading? Reload</button>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var bootScreen = document.getElementById('app-boot');
        if (bootScreen && !bootScreen.classList.contains('is-hidden')) {
          document.getElementById('boot-retry').hidden = false;
        }
      }, 15000);
      document.getElementById('boot-retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
    <div id="root"></div>
    <noscript>
      <p style="position:fixed;inset:auto 1rem 1rem;z-index:10000;color:#f5f6f7;text-align:center;font-family:system-ui,sans-serif">
        Enable JavaScript to use DUT Wolves Stats.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
